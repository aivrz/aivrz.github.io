<script>

    let customDishes = loadCustom();

    let excluded = loadExcluded();
    let history = loadHistory();
    let avoidRecent = true;
    let muted = localStorage.getItem(MUTE_KEY)==='1';
    let mode = 'menu';
    let lastFood = null;

    /* ---------- 工具 ---------- */
    function loadCustom(){ try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; } catch(e){ return []; } }
    function saveCustom(l){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(l)); }
    function loadExcluded(){ try { return new Set(JSON.parse(localStorage.getItem(EXCLUDE_KEY)) || []); } catch(e){ return new Set(); } }
    function saveExcluded(){ localStorage.setItem(EXCLUDE_KEY, JSON.stringify([...excluded])); }
    function loadHistory(){ try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e){ return []; } }
    function saveHistory(){ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    function allDishes(){ return DEFAULT_DISHES.concat(customDishes); }
    function currentDishes(){ const a=allDishes(); return activeTypes.size ? a.filter(d=>activeTypes.has(d.type)) : a; }
    function effectivePool(){
        let p = currentDishes().filter(d=>!excluded.has(d.name));
        if(avoidRecent && history.length){
            const recent = new Set(history.slice(0,3));
            const f = p.filter(d=>!recent.has(d.name));
            if(f.length) p = f;
        }
        return p;
    }
    function pickDish(){
        let p = effectivePool();
        if(!p.length) p = currentDishes();
        if(!p.length) return null;
        const total = p.reduce((s,d)=>s+(d.weight||1), 0);
        let r = Math.random()*total;
        for(const d of p){ r -= (d.weight||1); if(r<=0) return d; }
        return p[p.length-1];
    }
    function pushHistory(name){ history.unshift(name); if(history.length>12) history.length=12; saveHistory(); renderHistory(); }
    function pickTip(){ return TIPS[Math.floor(Math.random()*TIPS.length)]; }
    function $(id){ return document.getElementById(id); }

    /* ---------- 音效（WebAudio） ---------- */
    let actx=null;
    function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
    function beep(freq,dur,type,vol){ if(muted) return; const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol||0.05; o.connect(g); g.connect(c.destination); const t=c.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); o.stop(t+dur); }
    function sndTick(){ beep(760+Math.random()*240, 0.05, 'square', 0.025); }
    function sndDing(){ beep(1180, 0.28, 'sine', 0.06); }
    function sndWhoosh(){ beep(280, 0.32, 'sawtooth', 0.04); }

    /* ---------- 分类筛选 ---------- */
    function renderFilters(){
        const types=[]; allDishes().forEach(d=>{ if(!types.includes(d.type)) types.push(d.type); });
        const box=$('filters'); box.innerHTML='';
        types.forEach(t=>{ const c=document.createElement('button'); c.className='chip'+(activeTypes.has(t)?' active':''); c.textContent=t; c.onclick=()=>{ if(activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t); renderFilters(); renderFoodList(); rebuildCurrent(); }; box.appendChild(c); });
        const all=document.createElement('button'); all.className='chip'+(activeTypes.size===0?' active':''); all.textContent='全部'; all.onclick=()=>{ activeTypes.clear(); renderFilters(); renderFoodList(); rebuildCurrent(); }; box.appendChild(all);
    }
    function renderExcludeRow(){
        const row=$('excludeRow');
        if(!excluded.size){ row.innerHTML=''; return; }
        row.innerHTML='已划掉：'+[...excluded].map(n=>'<b>'+n+'</b>').join('、')+'　<button id="clearEx" style="border:none;background:#e74c3c;color:#fff;border-radius:12px;padding:3px 10px;cursor:pointer;font-size:.8rem;">恢复全部</button>';
        $('clearEx').onclick=()=>{ excluded.clear(); saveExcluded(); renderExcludeRow(); renderFoodList(); rebuildCurrent(); };
    }
    function renderFoodList(){
        const box=$('foodItems'); box.innerHTML='';
        currentDishes().forEach(d=>{
            const t=document.createElement('div'); t.className='food-tag'+(excluded.has(d.name)?' excluded':''); t.textContent=d.emoji+' '+d.name; t.title='点击划掉/恢复';
            t.onclick=()=>{ if(excluded.has(d.name)) excluded.delete(d.name); else excluded.add(d.name); saveExcluded(); renderExcludeRow(); renderFoodList(); rebuildCurrent(); };
            box.appendChild(t);
        });
    }
    function renderHistory(){
        const row=$('historyRow');
        row.innerHTML = history.length ? ('最近：<span>'+history.slice(0,5).join(' · ')+'</span>') : '最近：<span>暂无</span>';
    }
    function renderCustom(){
        const box=$('customList'); box.innerHTML='';
        if(!customDishes.length){ box.innerHTML='<span class="custom-empty">还没有自定义菜品，添加一道你常吃的吧~</span>'; return; }
        customDishes.forEach((d,i)=>{
            const item=document.createElement('div'); item.className='custom-item'; item.innerHTML='<span>'+d.emoji+' '+d.name+'</span>';
            const del=document.createElement('button'); del.textContent='×'; del.onclick=()=>{ customDishes.splice(i,1); saveCustom(customDishes); renderCustom(); renderFilters(); renderFoodList(); rebuildCurrent(); };
            item.appendChild(del); box.appendChild(item);
        });
    }
    function addDish(){
        const inp=$('customName'); const name=inp.value.trim();
        if(!name) return;
        customDishes.push({ name, type:'自定义', color:'#7f8c8d', emoji:'🍴' });
        saveCustom(customDishes); inp.value=''; renderCustom(); renderFilters(); renderFoodList(); rebuildCurrent();
    }

    /* ---------- 老虎机 ---------- */
    function buildMachine(){
        const c=$('reelsContainer'); c.innerHTML=''; const dishes=effectivePool(); if(!dishes.length) return;
        for(let i=0;i<3;i++){ const reel=document.createElement('div'); reel.className='reel'; const inner=document.createElement('div'); inner.className='reel-inner'; inner.id='reel-'+i;
            for(let k=0;k<3;k++){ dishes.forEach(d=>{ const it=document.createElement('div'); it.className='reel-item'; it.style.backgroundColor=d.color; it.textContent=d.emoji; inner.appendChild(it); }); }
            const glass=document.createElement('div'); glass.className='reel-glass'; reel.appendChild(inner); reel.appendChild(glass); c.appendChild(reel); }
    }
    let machineSpinning=false;
    function spinMachine(){
        if(machineSpinning) return; const dishes=effectivePool(); if(!dishes.length){ alert('候选为空，先恢复几道菜~'); return; }
        machineSpinning=true; $('spinMachine').disabled=true; sndWhoosh();
        const pick=pickDish(); const ih=93.33, per=dishes.length; const idx=dishes.findIndex(d=>d.name===pick.name);
        for(let i=0;i<3;i++){ const inner=$('reel-'+i); inner.style.transition='none'; inner.style.top='0px'; void inner.offsetHeight;
            inner.style.transition='top '+(3+i*0.5)+'s cubic-bezier(0.25,0.1,0.25,1)'; inner.style.top=(-(idx*ih+2*per*ih-ih))+'px';
            inner.addEventListener('transitionend', function h(){ inner.removeEventListener('transitionend',h); if(i===2){ showResult(pick); machineSpinning=false; $('spinMachine').disabled=false; } }); }
    }
    /* ---------- 大转盘 ---------- */
    let wheelRot=0, wheelSpinning=false;
    function buildWheel(){
        const wheel=$('wheel'); const dishes=effectivePool(); const n=dishes.length; wheelRot=0; wheel.style.transition='none'; wheel.style.transform='rotate(0deg)';
        if(!n){ wheel.innerHTML=''; wheel.style.background='#fff'; return; }
        const seg=360/n; let grad=[];
        for(let i=0;i<n;i++){ grad.push(dishes[i].color+' '+(i*seg).toFixed(2)+'deg '+((i+1)*seg).toFixed(2)+'deg'); }
        wheel.style.background='conic-gradient('+grad.join(',')+')'; wheel.innerHTML='';
        for(let i=0;i<n;i++){ const lab=document.createElement('div'); lab.className='wheel-label'; lab.textContent=dishes[i].emoji; const ang=i*seg+seg/2; lab.style.transform='rotate('+ang+'deg) translateY(-140px) rotate('+(-ang)+'deg) translate(-50%,-50%)'; wheel.appendChild(lab); }
    }
    function spinWheel(){
        if(wheelSpinning) return; const dishes=effectivePool(); if(!dishes.length){ alert('候选为空，先恢复几道菜~'); return; }
        wheelSpinning=true; $('spinWheelBtn').disabled=true; sndTick();
        const n=dishes.length, seg=360/n; const land=Math.floor(Math.random()*n); const landRot=360-(land*seg+seg/2); const cur=((wheelRot%360)+360)%360; let delta=((landRot-cur)%360+360)%360; wheelRot+=360*6+delta;
        $('wheel').style.transition='transform 4.5s cubic-bezier(0.17,0.67,0.12,0.99)'; $('wheel').style.transform='rotate('+wheelRot+'deg)';
        $('wheel').addEventListener('transitionend', function h(){ $('wheel').removeEventListener('transitionend',h); showResult(dishes[land]); wheelSpinning=false; $('spinWheelBtn').disabled=false; });
    }
    /* ---------- 骰子 ---------- */
    const PIP_MAP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
    function drawDie(el,val){ el.innerHTML=''; for(let i=0;i<9;i++){ const p=document.createElement('div'); p.className='pip '+(PIP_MAP[val].includes(i)?'on':'off'); el.appendChild(p); } }
    let rolling=false;
    function rollDice(){
        if(rolling) return; const dishes=effectivePool(); if(!dishes.length){ alert('候选为空，先恢复几道菜~'); return; }
        rolling=true; $('rollDiceBtn').disabled=true; let ticks=0;
        const timer=setInterval(()=>{ drawDie($('die1'),1+Math.floor(Math.random()*6)); drawDie($('die2'),1+Math.floor(Math.random()*6)); sndTick(); if(++ticks>10){ clearInterval(timer); const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6); drawDie($('die1'),d1); drawDie($('die2'),d2); const land=(d1+d2-2)%dishes.length; showResult(dishes[land]); rolling=false; $('rollDiceBtn').disabled=false; } },80);
    }
    /* ---------- 刮刮乐 ---------- */
    let scratchRevealed=false;
    function buildScratch(){
        const dish=pickDish(); if(!dish){ alert('候选为空'); return; }
        $('scratchPrize').querySelector('.em').textContent=dish.emoji; $('scratchPrize').querySelector('.nm').textContent=dish.name;
        const cv=$('scratchCanvas'); const ctx=cv.getContext('2d'); ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#9aa5b1'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.fillStyle='#cfd8e3'; for(let i=0;i<40;i++){ ctx.beginPath(); ctx.arc(Math.random()*cv.width,Math.random()*cv.height,Math.random()*10+4,0,7); ctx.fill(); }
        ctx.fillStyle='#6b7280'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.fillText('刮开我', cv.width/2, cv.height/2+7);
        scratchRevealed=false; cv.style.display='block'; cv.onpointerdown=null; cv.onpointermove=null;
        let drawing=false;
        function pos(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) }; }
        function scratchAt(p){ ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(p.x,p.y,18,0,7); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
        function pct(){ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let cl=0; for(let i=3;i<d.length;i+=4){ if(d[i]===0) cl++; } return cl/(d.length/4); }
        cv.onpointerdown=(e)=>{ drawing=true; scratchAt(pos(e)); sndTick(); };
        cv.onpointermove=(e)=>{ if(!drawing) return; scratchAt(pos(e)); if(Math.random()<0.3) sndTick(); if(!scratchRevealed && pct()>0.6) finishScratch(dish); };
        cv.onpointerup=()=>{ drawing=false; }; cv.onpointerleave=()=>{ drawing=false; };
    }
    function finishScratch(dish){ if(scratchRevealed) return; scratchRevealed=true; $('scratchCanvas').style.display='none'; showResult(dish); }
    /* ---------- 抽签筒 ---------- */
    function drawStick(){

            $('stickResultWrap').innerHTML='<div class="stick-result"><div class="em">'+dish.emoji+'</div><div class="nm">'+dish.name+'</div><div class="fortune">签文：'+fortune+'</div><button class="spin-button" id="stickToResult" style="margin-top:12px;padding:10px 28px;font-size:1rem;">就这个！</button></div>';
            $('stickToResult').onclick=()=>showResult(dish);
        }, 520);
    }
    /* ---------- 翻牌 ---------- */
    let flipLocked=false;
    function buildFlip(){
        const dishes=effectivePool(); if(!dishes.length){ alert('候选为空'); return; }
        const pool=dishes.slice(); for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
        const N=Math.min(6, pool.length); const pick=pool.slice(0,N);
        const grid=$('flipGrid'); grid.innerHTML=''; flipLocked=false;
        pick.forEach(d=>{ const card=document.createElement('div'); card.className='flip-card'; card.innerHTML='<div class="flip-inner"><div class="flip-face flip-back"><i class="fas fa-question"></i></div><div class="flip-face flip-front"><div class="em">'+d.emoji+'</div><div class="nm">'+d.name+'</div></div></div>';
            card.onclick=()=>{ if(flipLocked) return; card.classList.add('flipped'); flipLocked=true; sndDing(); setTimeout(()=>showResult(d), 450); };
            grid.appendChild(card);
        });
    }
    /* ---------- 抽卡 SSR ---------- */
    function rollRarity(){ const r=Math.random(); if(r<0.05) return 'SSR'; if(r<0.30) return 'SR'; return 'R'; }
    function drawGacha(){
        const dish=pickDish(); if(!dish){ alert('候选为空'); return; }
        const rarity=rollRarity(); sndDing();
        const cls = rarity==='SSR'?'rarity-SSR':rarity==='SR'?'rarity-SR':'rarity-R';
        $('gachaResultWrap').innerHTML='<div class="gacha-result '+cls+'"><div class="em">'+dish.emoji+'</div><div class="nm">'+dish.name+'</div><div class="rar">'+rarity+'</div><button class="spin-button" id="gachaToResult" style="margin-top:12px;padding:10px 28px;font-size:1rem;">就这个！</button></div>';
        $('gachaToResult').onclick=()=>showResult(dish);
    }
    /* ---------- 结果弹窗 ---------- */
    function showResult(food){
        if(!food) return; lastFood=food; pushHistory(food.name);
        $('rmEmoji').textContent=food.emoji; $('rmName').textContent=food.name; $('rmTip').textContent=pickTip();
        $('rmCouponQr').src=COUPON_QR; $('rmPageQr').src=QR_API+encodeURIComponent(location.href);
        $('resultModal').classList.add('show');
    }
    function closeModal(){ $('resultModal').classList.remove('show'); }
    function share(){ const data={ title:'今天吃啥', text:'不如吃 '+lastFood.name+'？', url:location.href }; if(navigator.share){ navigator.share(data).catch(()=>{}); } else { navigator.clipboard.writeText(location.href).then(showToast).catch(()=>alert('链接：'+location.href)); } }
    function showToast(){ const t=$('copyToast'); t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
    /* ---------- 今日老黄历 ---------- */
    const JIANCHU = [
        {n:'建', yi:'祭祀 祈福 出行 纳财', ji:'动土 破土 安葬'},
        {n:'除', yi:'除服 疗病 出行 拆卸', ji:'求财 嫁娶 开市'},
        {n:'满', yi:'祭祀 祈福 开市 交易', ji:'服药 栽种 安葬'},
        {n:'平', yi:'修饰 装修 平治 出行', ji:'祈福 求嗣 开渠'},
        {n:'定', yi:'订婚 纳采 立约 入学', ji:'诉讼 出行 移徙'},
        {n:'执', yi:'捕捉 结网 求医 栽种', ji:'开市 交易 移徙'},
        {n:'破', yi:'破屋 求医 拆卸 沐浴', ji:'嫁娶 开市 动土'},
        {n:'危', yi:'安床 祭祀 祈福', ji:'登高 乘船 出行'},
        {n:'成', yi:'开市 嫁娶 入学 立约', ji:'诉讼 争讼 破土'},
        {n:'收', yi:'纳财 收账 进人口 捕捉', ji:'开市 出行 安葬'},
        {n:'开', yi:'开市 交易 入学 出行 嫁娶', ji:'安葬 破土 服药'},
        {n:'闭', yi:'安葬 筑堤 埋穴 塞穴', ji:'开市 出行 手术'}
    ];
    function lunarText(){
        try{ return new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{dateStyle:'long'}).format(new Date()); }
        catch(e){ try{ return new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric',month:'long',day:'2-digit'}).format(new Date()); }catch(e2){ return ''; } }
    }
    function zodiacText(){
        try{
            const y=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric'}).format(new Date());
            const B={子:'鼠',丑:'牛',寅:'虎',卯:'兔',辰:'龙',巳:'蛇',午:'马',未:'羊',申:'猴',酉:'鸡',戌:'狗',亥:'猪'};
            for(const k in B){ if(y.indexOf(k)>=0) return B[k]; }
            return '';
        }catch(e){ return ''; }
    }
    function almanac(){ const n=new Date(); const dayNo=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/86400000); return JIANCHU[((dayNo%12)+12)%12]; }

    /* ---------- 菜单海报 ---------- */
    function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>rej(new Error('img load fail')); im.src=src; }); }
    function drawRound(x,px,py,w,h,r,fill){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); if(fill){ x.fillStyle=fill; x.fill(); } }
    function drawImgFit(x,im,px,py,size){ drawRound(x,px-5,py-5,size+10,size+10,10,'#fff'); x.drawImage(im,px,py,size,size); }
    function drawQrPlaceholder(x,px,py,size,label){ drawRound(x,px-5,py-5,size+10,size+10,10,'#fff'); x.fillStyle='#eef2f6'; x.fillRect(px,py,size,size); x.fillStyle='#95a5a6'; x.font='13px "Microsoft YaHei",sans-serif'; x.textAlign='center'; x.fillText(label, px+size/2, py+size/2); }
    function openPoster(){ if(!lastFood) return; $('posterModal').classList.add('show'); $('posterImg').src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; $('posterDl').href='#'; buildPoster(); }
    function closePoster(){ $('posterModal').classList.remove('show'); }
    function buildPoster(){
        const W=600,H=920; const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
        const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#fff7ec'); g.addColorStop(1,'#ffe2c4'); x.fillStyle=g; x.fillRect(0,0,W,H);
        x.fillStyle='#e74c3c'; x.fillRect(0,0,W,12); x.fillStyle='#f39c12'; x.fillRect(0,H-12,W,12);
        x.textAlign='center';
        x.fillStyle='#d35400'; x.font='bold 42px "Microsoft YaHei",sans-serif'; x.fillText('今天吃啥', W/2, 74);
        const now=new Date();
        x.fillStyle='#7f8c8d'; x.font='20px "Microsoft YaHei",sans-serif';
        x.fillText(now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}), W/2, 108);
        const lun=lunarText(); const z=zodiacText(); if(lun) x.fillText('农历 '+lun+(z?('（'+z+'年）'):''), W/2, 138);
        // 菜品卡
        drawRound(x,40,165,W-80,240,20,'#ffffff');
        x.font='120px sans-serif'; x.fillText(lastFood.emoji, W/2, 288);
        x.fillStyle='#2c3e50'; x.font='bold 54px "Microsoft YaHei",sans-serif'; x.fillText(lastFood.name, W/2, 356);
        x.fillStyle='#7f8c8d'; x.font='22px "Microsoft YaHei",sans-serif'; x.fillText($('rmTip').textContent, W/2, 392);
        // 老黄历卡
        const al=almanac();
        drawRound(x,40,425,W-80,168,20,'#fff4e0');
        x.fillStyle='#c0392b'; x.font='bold 24px "Microsoft YaHei",sans-serif'; x.fillText('今日黄历 · 建'+al.n+'日', W/2, 462);
        x.textAlign='left';
        x.fillStyle='#27ae60'; x.font='bold 22px "Microsoft YaHei",sans-serif'; x.fillText('宜', 70, 508);
        x.fillStyle='#2c3e50'; x.font='22px "Microsoft YaHei",sans-serif'; x.fillText(al.yi, 112, 508);
        x.fillStyle='#c0392b'; x.font='bold 22px "Microsoft YaHei",sans-serif'; x.fillText('忌', 70, 548);
        x.fillStyle='#2c3e50'; x.font='22px "Microsoft YaHei",sans-serif'; x.fillText(al.ji, 112, 548);
        x.textAlign='center';
        // 二维码区
        x.fillStyle='#95a5a6'; x.font='18px "Microsoft YaHei",sans-serif'; x.fillText('扫码用小程序 / 打开本页', W/2, 636);
        const QS=130, ly=660, lx=140, rx=330;
        const pageSrc='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(location.href);
        const jobs=[];
        // 小程序码：复用页面同一个 MINIAPP_QR 常量（底部推广条 + 本海报），无需单独配置
        if(MINIAPP_QR){ jobs.push(loadImg(MINIAPP_QR).then(im=>drawImgFit(x,im,lx,ly,QS)).catch(()=>drawQrPlaceholder(x,lx,ly,QS,'小程序码'))); }
        else { drawQrPlaceholder(x,lx,ly,QS,'小程序码'); }
        jobs.push(loadImg(pageSrc).then(im=>drawImgFit(x,im,rx,ly,QS)).catch(()=>drawQrPlaceholder(x,rx,ly,QS,'页面二维码')));
        Promise.all(jobs).then(()=>{
            x.fillStyle='#7f8c8d'; x.font='16px "Microsoft YaHei",sans-serif'; x.textAlign='center';
            x.fillText('小程序码', lx+QS/2, ly+QS+26);
            x.fillText('本页二维码', rx+QS/2, ly+QS+26);
            x.fillStyle='#d35400'; x.font='bold 20px "Microsoft YaHei",sans-serif'; x.fillText('扫码领券更划算 · injd.cn', W/2, 876);
            const url=cv.toDataURL('image/png'); $('posterImg').src=url; $('posterDl').href=url;
        }).catch(()=>{});
    }
    /* ---------- 商业化弹窗 ---------- */
    function openPromo(){
        $('promoCoupon').src=COUPON_QR;
        $('promoModal').classList.add('show');
    }
    function closePromo(){ $('promoModal').classList.remove('show'); }
    /* ---------- 模式切换 ---------- */
    function rebuildCurrent(){ if(mode==='machine') buildMachine(); else if(mode==='wheel') buildWheel(); else if(mode==='scratch') buildScratch(); else if(mode==='flip') buildFlip(); }
    function scrollTop(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }
    function showMode(m){
        mode=m;
        document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
        if(m==='menu'){ scrollTop(); return; }
        if(m==='quick'){ const d=pickDish(); if(d) showResult(d); else alert('候选为空'); scrollTop(); return; }
        const map={ machine:'machineSection', wheel:'wheelSection', dice:'diceSection', scratch:'scratchSection', sticks:'sticksSection', flip:'flipSection', gacha:'gachaSection' };
        $(map[m]).classList.remove('hidden');
        if(m==='machine') buildMachine();
        else if(m==='wheel') buildWheel();
        else if(m==='scratch') buildScratch();
        else if(m==='flip') buildFlip();
        else if(m==='sticks'){ $('stickResultWrap').innerHTML=''; }
        else if(m==='gacha'){ $('gachaResultWrap').innerHTML=''; }
        setTimeout(()=>{ try{ $('playArea').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }, 60);
    }
    /* ---------- 绑定 ---------- */
    document.querySelectorAll('.mode-card').forEach(c=> c.onclick=()=>showMode(c.dataset.mode));
    document.querySelectorAll('[data-back]').forEach(b=> b.onclick=()=>showMode('menu'));
    $('spinMachine').onclick=spinMachine;
    $('spinWheelBtn').onclick=spinWheel;
    $('rollDiceBtn').onclick=rollDice;
    $('scratchAgain').onclick=()=>{ buildScratch(); };
    $('drawStickBtn').onclick=drawStick;
    $('flipAgain').onclick=()=>{ buildFlip(); };
    $('drawGachaBtn').onclick=drawGacha;
    $('addDishBtn').onclick=addDish;
    $('customName').addEventListener('keydown', e=>{ if(e.key==='Enter') addDish(); });
    $('avoidRecent').onchange=(e)=>{ avoidRecent=e.target.checked; };
    $('soundToggle').onclick=()=>{ muted=!muted; localStorage.setItem(MUTE_KEY, muted?'1':'0'); $('soundToggle').innerHTML='<i class="fas fa-volume-'+(muted?'mute':'up')+'"></i>'; if(!muted) sndDing(); };
    $('rmClose').onclick=closeModal;
    $('rmAgain').onclick=()=>{ closeModal(); if(mode==='machine') spinMachine(); else if(mode==='wheel') spinWheel(); else if(mode==='dice') rollDice(); else if(mode==='scratch') buildScratch(); else if(mode==='flip') buildFlip(); else if(mode==='sticks') drawStick(); else if(mode==='gacha') drawGacha(); else { const d=pickDish(); if(d) showResult(d); } };
    $('rmOk').onclick=closeModal;
    $('rmShare').onclick=share;
    $('rmCardBtn').onclick=openPoster;
    $('rmCouponQr').onclick=openPromo;
    $('posterClose').onclick=closePoster;
    $('posterModal').addEventListener('click', e=>{ if(e.target===$('posterModal')) closePoster(); });
    $('resultModal').addEventListener('click', e=>{ if(e.target===$('resultModal')) closeModal(); });
    $('promoBar').onclick=openPromo;
    $('promoClose').onclick=closePromo;
    $('promoModal').addEventListener('click', e=>{ if(e.target===$('promoModal')) closePromo(); });
    /* ---------- 初始化 ---------- */
    drawDie($('die1'),3); drawDie($('die2'),4);
    $('soundToggle').innerHTML='<i class="fas fa-volume-'+(muted?'mute':'up')+'"></i>';
    $('pbCoupon').src=COUPON_QR;
    $('dateDisplay').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    renderFilters(); renderExcludeRow(); renderFoodList(); renderHistory(); renderCustom();
});
</script>
</body>
